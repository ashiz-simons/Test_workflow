name: iOS-blank-test
on:
  workflow_dispatch:
jobs:
  build-ios:
    name: Blank Flutter iOS Build
    runs-on: macos-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter create hello_world
      - run: flutter pub get
        working-directory: hello_world
      - run: flutter build ios --release --no-codesign
        working-directory: hello_world
      - run: mkdir Payload
        working-directory: hello_world/build/ios/iphoneos
      - run: mv Runner.app/ Payload
        working-directory: hello_world/build/ios/iphoneos
      - name: Zip output
        run: zip -qq -r -9 BlankIpaExport.ipa Payload
        working-directory: hello_world/build/ios/iphoneos
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: hello_world/build/ios/iphoneos/BlankIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "Blank Flutter test build"
